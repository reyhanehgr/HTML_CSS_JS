<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css"/>
    
    <title>Landing Page</title>
</head>
<body>

  <main class="calculator">
    <h1>10% Calculator</h1>

    <p class="description">
      Enter a number and add 10% to it.
    </p>

    <label for="number">Enter a number</label>

    <!-- INPUT -->
    <input
      type="number"
      id="number"
      placeholder="e.g. 100"
    >

    <!-- BUTTON -->
    <button id="calculateBtn">
      Calculate
    </button>

    <!-- RESULT -->
    <div class="result">
      Result
      <span id="result">—</span>
    </div>
  </main>

</body>
<script src="javascript.js"></script>
</html>
